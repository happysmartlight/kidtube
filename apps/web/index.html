<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1"
    />
    <meta name="theme-color" content="#0c0a14" />
    <meta name="description" content="Kênh video an toàn cho con, do bố mẹ chọn" />

    <!-- PWA: cai lên tablet de chay fullscreen, an thanh dia chi
         -> tre khong thoat ra trinh duyet duoc (nguyen tac P4) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KidTube" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />

    <!-- Font tron, than thien, ho tro day du dau tieng Viet.
         Neu Pi offline thi fallback ve system-ui — app van dung duoc binh thuong. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>KidTube — Video của con</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
